<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>AVA Velodrome Pacer</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111827;color:#fff}.app{max-width:700px;margin:auto;padding:20px}.controls,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:14px}input,select,button{box-sizing:border-box;width:100%;font-size:20px;padding:14px;border-radius:12px;border:1px solid #4b5563;background:#1f2937;color:white}button{font-weight:700}.adjust{display:grid;grid-template-columns:70px 1fr 70px;gap:8px}.display{text-align:center;padding:28px 10px}.status{letter-spacing:.18em;color:#9ca3af;font-weight:700}.clock{font:900 clamp(72px,24vw,150px)/1 monospace;margin:15px 0}.lap{font-size:28px}.start{background:#2563eb}.note{color:#cbd5e1;font-size:14px;margin-top:16px}@media(max-width:420px){.controls{grid-template-columns:1fr}.buttons button{font-size:17px}}</style></head><body><main class="app"><h1>AVA Velodrome Pacer</h1><div class="adjust"><button id="minus">−0.1</button><input id="lapTime" type="number" min="0.1" step="0.1" value="16.5" inputmode="decimal"><button id="plus">+0.1</button></div><div class="controls" style="margin-top:12px"><label>Total laps<input id="laps" type="number" min="1" value="20"></label><label>Start countdown<select id="countdown"><option>3</option><option>5</option><option>10</option><option value="0">None</option></select></label></div><section class="display"><div class="status" id="status">READY</div><div class="clock" id="clock">16.5</div><div class="lap">LAP <b id="current">0</b> / <b id="total">20</b></div><div style="margin-top:8px">TARGET <b id="target">16.5</b> s</div></section><div class="buttons"><button class="start" id="sound">🔊 ENABLE SOUND</button><button class="start" id="start">▶ START</button><button id="pause">Ⅱ PAUSE</button><button id="reset">↻ RESET</button><button id="test">🔊 TEST SOUND</button></div><p class="note">For velodrome use, connect the phone to a Bluetooth or PA speaker and turn media volume up. Keep the screen awake while timing.</p></main><script>
const $=x=>document.getElementById(x),lt=$('lapTime'),laps=$('laps'),clock=$('clock'),status=$('status'),cur=$('current'),total=$('total'),target=$('target');let ac,running=false,paused=false,startAt=0,pauseElapsed=0,lastLap=0,raf,ctimer;
function cfg(){return{t:Math.max(.1,+lt.value||16.5),n:Math.max(1,Math.round(+laps.value||20))}}function sync(){let c=cfg();lt.value=c.t.toFixed(1);total.textContent=c.n;target.textContent=c.t.toFixed(1);if(!running&&!paused)clock.textContent=c.t.toFixed(1)}function audio(){ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}function beep(f=1000,d=.35){audio();let o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}function frame(){if(!running)return;let c=cfg(),e=(performance.now()-startAt)/1000,done=Math.floor(e/c.t),within=e-done*c.t;if(done>lastLap){for(let i=lastLap;i<Math.min(done,c.n);i++)beep();lastLap=done}cur.textContent=Math.min(done,c.n);clock.textContent=Math.max(0,c.t-within).toFixed(1);if(done>=c.n){running=false;status.textContent='FINISHED';clock.textContent='0.0';beep(1300,.7);return}raf=requestAnimationFrame(frame)}function begin(){sync();lastLap=0;cur.textContent=0;startAt=performance.now();running=true;paused=false;status.textContent='RUNNING';beep(1200,.45);raf=requestAnimationFrame(frame)}$('sound').onclick=async()=>{audio();try{await ac.resume()}catch(e){}beep(900,.25);$('sound').textContent='✓ SOUND READY';status.textContent='SOUND READY'};$('start').onclick=()=>{audio();if(running)return;if(paused){startAt=performance.now()-pauseElapsed*1000;paused=false;running=true;status.textContent='RUNNING';raf=requestAnimationFrame(frame);return}let c=+$('countdown').value;if(!c)return begin();status.textContent='GET READY';clock.textContent=c;beep(600,.15);ctimer=setInterval(()=>{c--;if(c){clock.textContent=c;beep(600,.15)}else{clearInterval(ctimer);clock.textContent='GO';beep(1300,.5);setTimeout(begin,300)}},1000)};$('pause').onclick=()=>{if(!running)return;pauseElapsed=(performance.now()-startAt)/1000;running=false;paused=true;cancelAnimationFrame(raf);status.textContent='PAUSED'};$('reset').onclick=()=>{running=paused=false;lastLap=0;clearInterval(ctimer);cancelAnimationFrame(raf);cur.textContent=0;status.textContent='READY';sync()};$('test').onclick=()=>beep();$('minus').onclick=()=>{lt.value=Math.max(.1,cfg().t-.1).toFixed(1);sync()};$('plus').onclick=()=>{lt.value=(cfg().t+.1).toFixed(1);sync()};lt.onchange=laps.onchange=sync;sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
