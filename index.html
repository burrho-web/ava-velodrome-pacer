<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AVA Pacer">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>AVA Velodrome Pacer</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#111827;color:#fff}
    .app{max-width:700px;margin:auto;padding:20px}
    .controls,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-size:14px}
    input,select,button{box-sizing:border-box;width:100%;font-size:20px;padding:14px;border-radius:12px;border:1px solid #4b5563;background:#1f2937;color:white}
    button{font-weight:700}
    .adjust{display:grid;grid-template-columns:70px 1fr 70px;gap:8px}
    .display{text-align:center;padding:28px 10px}
    .status{letter-spacing:.18em;color:#9ca3af;font-weight:700}
    .clock{font:900 clamp(72px,24vw,150px)/1 monospace;margin:15px 0}
    .speed{font-size:clamp(38px,12vw,68px);font-weight:900;margin:8px 0 18px}
    .speed small{font-size:.42em;font-weight:800}
    .speedlabel{font-size:14px;letter-spacing:.14em;color:#9ca3af;font-weight:700;margin-top:-12px;margin-bottom:18px}
    .lap{font-size:28px}
    .start{background:#2563eb}
    .note{color:#cbd5e1;font-size:14px;margin-top:16px}
    @media(max-width:420px){.controls{grid-template-columns:1fr}.buttons button{font-size:17px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>AVA Velodrome Pacer</h1>

    <div class="adjust">
      <button id="minus">−0.1</button>
      <input id="lapTime" type="number" min="0.1" step="0.1" value="16.5" inputmode="decimal">
      <button id="plus">+0.1</button>
    </div>

    <div class="controls" style="margin-top:12px">
      <label>Track line
        <select id="trackLine">
          <option value="250">Black line — 250 m</option>
          <option value="267.5">Blue line — 267.5 m</option>
          <option value="285">Top of track — 285 m</option>
        </select>
      </label>
      <label>Total laps
        <input id="laps" type="number" min="1" value="20">
      </label>
      <label>Start countdown
        <select id="countdown">
          <option>3</option>
          <option>5</option>
          <option>10</option>
          <option value="0">None</option>
        </select>
      </label>
      <label>Sound
        <select id="soundType">
          <option value="loud" selected>Loud Beep</option>
          <option value="whistle">High Whistle</option>
          <option value="double">Double Beep</option>
          <option value="horn">Horn</option>
          <option value="bell">Bell</option>
        </select>
      </label>
      <label>Sound volume
        <select id="soundVolume">
          <option value="0.55">Normal</option>
          <option value="0.85" selected>Loud</option>
          <option value="1.00">MAX</option>
        </select>
      </label>
    </div>

    <section class="display">
      <div class="status" id="status">READY</div>
      <div class="clock" id="clock">16.5</div>
      <div class="speed"><span id="speed">54.5</span> <small>km/h</small></div>
      <div class="speedlabel" id="speedLabel">BLACK LINE — 250 m TARGET SPEED</div>
      <div class="lap">LAP <b id="current">0</b> / <b id="total">20</b></div>
      <div style="margin-top:8px">TARGET <b id="target">16.5</b> s</div>
    </section>

    <div class="buttons">
      <button class="start" id="start">▶ START</button>
      <button id="pause">Ⅱ PAUSE</button>
      <button id="reset">↻ RESET</button>
      <button id="test">🔊 TEST SOUND</button>
    </div>

    <p class="note">For velodrome use, set your phone and Bluetooth/PA speaker media volume to maximum. Choose a sound above and use TEST SOUND before the session. Keep the screen awake while timing.</p>
  </main>

  <script>
    const $ = x => document.getElementById(x);
    const lt = $('lapTime');
    const laps = $('laps');
    const line = $('trackLine');
    const clock = $('clock');
    const status = $('status');
    const cur = $('current');
    const total = $('total');
    const target = $('target');
    const speed = $('speed');
    const speedLabel = $('speedLabel');
    const soundType = $('soundType');
    const soundVolume = $('soundVolume');

    let ac, running = false, paused = false, startAt = 0, pauseElapsed = 0, lastLap = 0, raf, ctimer;

    const lineNames = {
      '250': 'BLACK LINE',
      '267.5': 'BLUE LINE',
      '285': 'TOP OF TRACK'
    };

    function cfg(){
      return {
        t: Math.max(.1, +lt.value || 16.5),
        n: Math.max(1, Math.round(+laps.value || 20)),
        d: Math.max(.1, +line.value || 250)
      };
    }

    function sync(){
      let c = cfg();
      lt.value = c.t.toFixed(1);
      total.textContent = c.n;
      target.textContent = c.t.toFixed(1);
      speed.textContent = (c.d / c.t * 3.6).toFixed(1);
      speedLabel.textContent = `${lineNames[String(c.d)] || 'TRACK'} — ${c.d} m TARGET SPEED`;
      if(!running && !paused) clock.textContent = c.t.toFixed(1);
    }

    function audio(){
      ac ??= new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === 'suspended') ac.resume();
    }

    function tone(freq, duration, gainValue, type = 'square', delay = 0){
      audio();
      const o = ac.createOscillator();
      const g = ac.createGain();
      const now = ac.currentTime + delay;
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, gainValue), now + 0.01);
      g.gain.setValueAtTime(Math.max(0.001, gainValue), Math.max(now + 0.01, now + duration - 0.04));
      g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + duration + 0.02);
    }

    function soundPreset(kind = soundType.value, volume = +soundVolume.value || 0.85){
      // Web browsers cannot exceed the phone/speaker's hardware volume.
      // These presets use strong, attention-grabbing frequencies for better audibility.
      switch(kind){
        case 'whistle':
          tone(2200, .48, volume, 'square');
          tone(2750, .48, volume * .65, 'sine');
          break;
        case 'double':
          tone(1250, .18, volume, 'square', 0);
          tone(1250, .22, volume, 'square', .27);
          break;
        case 'horn':
          tone(520, .58, volume, 'sawtooth');
          tone(650, .58, volume * .78, 'square');
          break;
        case 'bell':
          tone(1100, .65, volume * .85, 'sine');
          tone(1650, .45, volume * .55, 'sine');
          tone(2200, .30, volume * .35, 'sine');
          break;
        case 'loud':
        default:
          tone(1150, .42, volume, 'square');
          tone(1450, .42, volume * .7, 'square');
          break;
      }
    }

    function beep(f = 1000, d = .35){
      // Preserve special start/countdown tones; use the chosen sound for lap beeps.
      if(f === 1000 && Math.abs(d - .35) < .001){
        soundPreset();
      } else {
        tone(f, d, +soundVolume.value || 0.85, 'square');
      }
    }

    function frame(){
      if(!running) return;
      let c = cfg(), e = (performance.now() - startAt) / 1000, done = Math.floor(e / c.t), within = e - done * c.t;
      if(done > lastLap){
        for(let i = lastLap; i < Math.min(done, c.n); i++) beep();
        lastLap = done;
      }
      cur.textContent = Math.min(done, c.n);
      clock.textContent = Math.max(0, c.t - within).toFixed(1);
      if(done >= c.n){
        running = false;
        status.textContent = 'FINISHED';
        clock.textContent = '0.0';
        beep(1300, .7);
        return;
      }
      raf = requestAnimationFrame(frame);
    }

    function begin(){
      sync();
      lastLap = 0;
      cur.textContent = 0;
      startAt = performance.now();
      running = true;
      paused = false;
      status.textContent = 'RUNNING';
      beep(1200, .45);
      raf = requestAnimationFrame(frame);
    }

    $('start').onclick = () => {
      audio();
      if(running) return;
      if(paused){
        startAt = performance.now() - pauseElapsed * 1000;
        paused = false;
        running = true;
        status.textContent = 'RUNNING';
        raf = requestAnimationFrame(frame);
        return;
      }
      let c = +$('countdown').value;
      if(!c) return begin();
      status.textContent = 'GET READY';
      clock.textContent = c;
      beep(600, .15);
      ctimer = setInterval(() => {
        c--;
        if(c){
          clock.textContent = c;
          beep(600, .15);
        } else {
          clearInterval(ctimer);
          clock.textContent = 'GO';
          beep(1300, .5);
          setTimeout(begin, 300);
        }
      }, 1000);
    };

    $('pause').onclick = () => {
      if(!running) return;
      pauseElapsed = (performance.now() - startAt) / 1000;
      running = false;
      paused = true;
      cancelAnimationFrame(raf);
      status.textContent = 'PAUSED';
    };

    $('reset').onclick = () => {
      running = paused = false;
      lastLap = 0;
      clearInterval(ctimer);
      cancelAnimationFrame(raf);
      cur.textContent = 0;
      status.textContent = 'READY';
      sync();
    };

    $('test').onclick = () => soundPreset();
    $('minus').onclick = () => { lt.value = Math.max(.1, cfg().t - .1).toFixed(1); sync(); };
    $('plus').onclick = () => { lt.value = (cfg().t + .1).toFixed(1); sync(); };
    lt.onchange = laps.onchange = line.onchange = sync;
    soundType.onchange = () => soundPreset();
    soundVolume.onchange = () => soundPreset();

    sync();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
